# Build and test Folio on every pull request and push to main (#65).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One fixed toolchain (#321); a separate job tries the newest Xcode on the runner without failing the run.
env:
  XCODE_VERSION: "26.6"

jobs:
  build-and-test:
    name: Build & Tests (macOS)
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        # Fails when the pinned Xcode is missing instead of building with another one (#321, #322).
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version | tee xcode.txt
          grep -q "^Xcode ${XCODE_VERSION}$" xcode.txt
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Format (#215)
        # Style from .swift-format (4 spaces, 180 columns); fix locally with: swift format -i -r Sources Tests
        run: swift format lint --strict -r Sources Tests

      - name: Build
        run: swift build

      - name: Test tools
        # PostgreSQL and MySQL for the database tests (#317); SQL Server needs Docker, which macOS runners lack.
        run: brew install --quiet postgresql@17 mysql && echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        timeout-minutes: 15
        # These tools are on the runner, so their tests must run: a missing one fails instead of skipping (#317).
        env:
          FOLIO_REQUIRE: python3,initdb,pg_ctl,psql,postgres,mysqld,mysql
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Skipped tests
        if: always()
        # Every skip is listed with its reason in the job summary (#317).
        run: |
          {
            echo "### Übersprungene Tests"
            grep -E "Test Case .* skipped|: Test skipped" test.log | sed -E 's/^.*-\[([^]]+)\].*$/- \1/' | sort -u || true
            grep -oE "Test skipped - .*" test.log | sort | uniq -c | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: App bundle
        run: ./scripts/build-app.sh

      - name: App self-tests (#223)
        timeout-minutes: 12
        # The app's own self-tests, headless: FOLIO_BACKGROUND=1 shows no window and takes no focus, every suite runs
        # against a fresh throwaway library. The keyboard test needs real focus and stays a local test.
        env:
          FOLIO_BACKGROUND: "1"
          FOLIO_REGRESSION_TIMEOUT: "150"
          FOLIO_REGRESSION_DIR: regression-logs
          FOLIO_SLOW_MACHINE: "1"
          # The accessibility audit depends on the runner's macOS version (system controls there have no names);
          # it runs locally before every release.
          FOLIO_REGRESSION_SKIP: A11Y
        # Runs the test copy of the bundle (own bundle ID), so the AppleScript part of AUTO (Folio.sdef) is tested too.
        run: |
          BIN="$(scripts/make-test-app.sh build/Folio.app "$RUNNER_TEMP/folio-test")"
          FOLIO_BINARY="$BIN" python3 scripts/dev-regression.py

      - name: Crash reports
        if: failure()
        run: python3 scripts/print-crash.py

      - name: Self-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-logs
          path: regression-logs/*.log
          if-no-files-found: ignore

      - name: Test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  complexity:
    # Independent of the app build, so a broken bundle never hides the report (#320).
    name: Complexity
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        # Fails when the pinned Xcode is missing instead of building with another one (#321, #322).
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version | tee xcode.txt
          grep -q "^Xcode ${XCODE_VERSION}$" xcode.txt
          swift --version

      - name: Cache complexity check
        uses: actions/cache@v4
        with:
          path: Tools/ComplexityCheck/.build
          key: complexity-${{ runner.os }}-${{ hashFiles('Tools/ComplexityCheck/Package.swift', 'Tools/ComplexityCheck/Package.resolved') }}

      - name: Complexity (#156)
        # Fails when a function is new or worse above 15 points; see docs/COMPLEXITY.md.
        run: |
          swift run -c release --package-path Tools/ComplexityCheck complexity-check \
            --baseline Tools/ComplexityCheck/baseline.json --report complexity.md --json complexity.json Sources

      - name: Complexity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complexity-report
          path: |
            complexity.md
            complexity.json
          if-no-files-found: ignore


  newest-xcode:
    # Early warning for the next Xcode; does not fail the run (#321).
    name: Newest Xcode (informational)
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build and test
        run: swift build && swift test

  ipad:
    # The iPad/iPhone app (#214) is iOS-only code that the macOS build never compiles (#316). Both configurations are
    # built (#341); the Debug build runs its self-test in a throwaway simulator.
    name: iPad (Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        # Fails when the pinned Xcode is missing instead of building with another one (#321, #322).
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version | tee xcode.txt
          grep -q "^Xcode ${XCODE_VERSION}$" xcode.txt
          swift --version

      - name: Build Release
        run: CONFIG=Release scripts/build-ipad.sh

      - name: Build Debug
        run: scripts/build-ipad.sh

      - name: Self-test in the simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          SET="$RUNNER_TEMP/simset"; mkdir -p "$SET"
          # An iPad the runtime actually supports ("Incompatible device" otherwise).
          read -r RUNTIME TYPE < <(xcrun simctl list runtimes -j | python3 -c 'import json,sys
          r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]][-1]
          t=[d for d in r.get("supportedDeviceTypes", []) if "iPad" in d["name"]]
          print(r["identifier"], t[-1]["identifier"])')
          UDID="$(xcrun simctl --set "$SET" create folio-ci "$TYPE" "$RUNTIME")"
          xcrun simctl --set "$SET" boot "$UDID"
          xcrun simctl --set "$SET" install "$UDID" build/FolioPad.app
          LIB="$RUNNER_TEMP/padlib"; mkdir -p "$LIB"
          SIMCTL_CHILD_FOLIO_LIBRARY="$LIB" SIMCTL_CHILD_FOLIO_PAD_SELFTEST=1 \
            xcrun simctl --set "$SET" launch --console-pty "$UDID" de.daniel.folio.pad | tee pad.log &
          for _ in $(seq 1 300); do grep -q "PAD done" pad.log 2>/dev/null && break; sleep 2; done
          xcrun simctl --set "$SET" shutdown "$UDID" || true
          xcrun simctl --set "$SET" delete "$UDID" || true
          grep "PAD" pad.log
          grep -q "PAD done ok" pad.log

      - name: Self-test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pad-self-test
          path: pad.log
          if-no-files-found: ignore
