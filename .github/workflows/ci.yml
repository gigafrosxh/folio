# Build and test Folio on every pull request and push to main (#65).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Tests (macOS)
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" || true
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Format (#215)
        # Style from .swift-format (4 spaces, 180 columns); fix locally with: swift format -i -r Sources Tests
        run: swift format lint --strict -r Sources Tests

      - name: Build
        run: swift build

      - name: Unit tests
        timeout-minutes: 12
        # Database tests skip themselves when PostgreSQL/MySQL/MSSQL tools are not installed.
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: App bundle
        run: ./scripts/build-app.sh

      - name: App self-tests (#223)
        timeout-minutes: 12
        # The app's own self-tests, headless: FOLIO_BACKGROUND=1 shows no window and takes no focus, every suite runs
        # against a fresh throwaway library. The keyboard test needs real focus and stays a local test.
        env:
          FOLIO_BACKGROUND: "1"
          FOLIO_REGRESSION_TIMEOUT: "150"
          FOLIO_REGRESSION_DIR: regression-logs
          FOLIO_SLOW_MACHINE: "1"
          # The accessibility audit depends on the runner's macOS version (system controls there have no names);
          # it runs locally before every release.
          FOLIO_REGRESSION_SKIP: A11Y
        # Runs the test copy of the bundle (own bundle ID), so the AppleScript part of AUTO (Folio.sdef) is tested too.
        run: |
          BIN="$(scripts/make-test-app.sh build/Folio.app "$RUNNER_TEMP/folio-test")"
          FOLIO_BINARY="$BIN" python3 scripts/dev-regression.py

      - name: Crash reports
        if: failure()
        run: python3 scripts/print-crash.py

      - name: Self-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-logs
          path: regression-logs/*.log
          if-no-files-found: ignore

      - name: Cache complexity check
        uses: actions/cache@v4
        with:
          path: Tools/ComplexityCheck/.build
          key: complexity-${{ runner.os }}-${{ hashFiles('Tools/ComplexityCheck/Package.swift', 'Tools/ComplexityCheck/Package.resolved') }}

      - name: Complexity (#156)
        # Fails when a function is new or worse above 15 points; see docs/COMPLEXITY.md.
        run: |
          swift run -c release --package-path Tools/ComplexityCheck complexity-check \
            --baseline Tools/ComplexityCheck/baseline.json --report complexity.md --json complexity.json Sources

      - name: Complexity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complexity-report
          path: |
            complexity.md
            complexity.json
          if-no-files-found: ignore

      - name: Test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  ipad:
    # The iPad/iPhone app (#214) is iOS-only code that the macOS build never compiles (#316). Both configurations are
    # built (#341); the Debug build runs its self-test in a throwaway simulator.
    name: iPad (Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        # No "|| true": a missing Xcode must fail the job, not build with the wrong one.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build Release
        run: CONFIG=Release scripts/build-ipad.sh

      - name: Build Debug
        run: scripts/build-ipad.sh

      - name: Self-test in the simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          SET="$RUNNER_TEMP/simset"; mkdir -p "$SET"
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')"
          TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; t=[x for x in json.load(sys.stdin)["devicetypes"] if "iPad" in x["name"]]; print(t[-1]["identifier"])')"
          UDID="$(xcrun simctl --set "$SET" create folio-ci "$TYPE" "$RUNTIME")"
          xcrun simctl --set "$SET" boot "$UDID"
          xcrun simctl --set "$SET" install "$UDID" build/FolioPad.app
          LIB="$RUNNER_TEMP/padlib"; mkdir -p "$LIB"
          SIMCTL_CHILD_FOLIO_LIBRARY="$LIB" SIMCTL_CHILD_FOLIO_PAD_SELFTEST=1 \
            xcrun simctl --set "$SET" launch --console-pty "$UDID" de.daniel.folio.pad | tee pad.log &
          for _ in $(seq 1 300); do grep -q "PAD done" pad.log 2>/dev/null && break; sleep 2; done
          xcrun simctl --set "$SET" shutdown "$UDID" || true
          xcrun simctl --set "$SET" delete "$UDID" || true
          grep "PAD" pad.log
          grep -q "PAD done ok" pad.log

      - name: Self-test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pad-self-test
          path: pad.log
          if-no-files-found: ignore
